<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3 Idiots • MADARA ALPHA</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
  import { getDatabase, ref, push, onValue, serverTimestamp, set, update, onDisconnect } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBTTVVmV2J4A8QqG9gaTFjhTzDW6RqgNps",
    authDomain: "madara-62f7b.firebaseapp.com",
    databaseURL: "https://madara-62f7b-default-rtdb.firebaseio.com",
    projectId: "madara-62f7b",
    storageBucket: "madara-62f7b.firebasestorage.app",
    messagingSenderId: "282972851212",
    appId: "1:282972851212:web:64980ccdfa06b317357229"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const rtdb = getDatabase(app);

  let replyTo = null;

  onAuthStateChanged(auth, user => {
    if (user) {
      authScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      
      const userRef = ref(rtdb, 'users/' + user.uid);
      set(userRef, { name: user.displayName, photo: user.photoURL, status: "Online" });
      onDisconnect(userRef).update({ status: "Offline" });

      loadMessages();
      loadUsers();
    } else {
      authScreen.style.display = 'flex';
      chatScreen.style.display = 'none';
    }
  });

  window.signup = async () => {
    const name = suName.value.trim();
    const avatar = document.querySelector('input[name="avatar"]:checked').value;
    if(!name) return alert("Pehle apna naam likho jani!");
    try {
      const cred = await createUserWithEmailAndPassword(auth, suEmail.value, suPass.value);
      await updateProfile(cred.user, { displayName: name, photoURL: avatar });
      location.reload();
    } catch (e) { alert(e.message); }
  };

  window.login = () => signInWithEmailAndPassword(auth, liEmail.value, liPass.value).catch(e => alert(e.message));
  window.logout = () => signOut(auth);

  window.sendMessage = () => {
    const text = msg.value.trim();
    if (!text) return;
    push(ref(rtdb, 'messages'), {
      text, uid: auth.currentUser.uid, name: auth.currentUser.displayName,
      photo: auth.currentUser.photoURL, time: serverTimestamp(), reply: replyTo
    });
    cancelReply();
    msg.value = '';
  };

  window.changeAvatar = async (newUrl) => {
    try {
        await updateProfile(auth.currentUser, { photoURL: newUrl });
        await update(ref(rtdb, 'users/' + auth.currentUser.uid), { photo: newUrl });
        editAvatarModal.style.display = 'none';
        userModal.style.display = 'none';
        alert("Avatar Change Ho Gaya! ✨");
    } catch (e) { alert(e.message); }
  };

  function loadMessages() {
    onValue(ref(rtdb, 'messages'), snap => {
      messages.innerHTML = '';
      snap.forEach(child => {
        const m = child.val();
        const isMe = m.uid === auth.currentUser.uid;
        const div = document.createElement('div');
        div.className = isMe ? 'msg me' : 'msg';
        div.onclick = () => setReply(m.name, m.text);
        div.innerHTML = `
          <img src="${m.photo}">
          <div>
            ${m.reply ? `<div class="reply-box"><b>${m.reply.name}</b><p>${m.reply.text}</p></div>` : ''}
            <b>${m.name}</b>
            <p>${m.text}</p>
          </div>`;
        messages.appendChild(div);
      });
      messages.scrollTop = messages.scrollHeight;
    });
  }

  function loadUsers() {
    onValue(ref(rtdb, 'users'), snap => {
      userList.innerHTML = '';
      let count = 0;
      snap.forEach(child => {
        const u = child.val();
        if(u.name) {
          count++;
          const isMe = child.key === auth.currentUser.uid;
          userList.innerHTML += `
            <div class="user-item">
              <img src="${u.photo}">
              <span style="flex:1"><b>${u.name}</b> <br> <small style="color:${u.status=='Online'?'#25d366':'#999'}">${u.status}</small></span>
              ${isMe ? `<button onclick="editAvatarModal.style.display='block'" style="background:#1d9bf0;color:#fff;border:none;padding:5px 10px;border-radius:8px;font-size:11px;cursor:pointer">Edit Avatar</button>` : ''}
            </div>`;
        }
      });
      userCount.innerText = count + " Members";
    });
  }

  window.setReply = (name, text) => {
    replyTo = { name, text };
    replyPreview.style.display = 'block';
    replyPreview.innerHTML = `Replying to <b>${name}</b>: ${text} <span onclick="cancelReply()">×</span>`;
  };
  window.cancelReply = () => { replyTo = null; replyPreview.style.display = 'none'; };
  window.toggleUserList = () => { userModal.style.display = userModal.style.display === 'block' ? 'none' : 'block'; };

</script>

<style>
  *{box-sizing:border-box; transition: 0.2s;}
  body{margin:0;font-family:system-ui;background:#0b141a;color:#fff; overflow: hidden;}
  
  /* LOGIN PAGE */
  #authScreen{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
  .authBox{width:100%;max-width:400px;text-align:center}
  .logo-big{width:130px;height:130px;border-radius:50%;margin-bottom:20px;border:4px solid #075e54;object-fit:cover}
  .authBox h2{font-size:30px;margin-bottom:25px;font-weight:bold; letter-spacing: 1px;}
  .authBox input{width:100%;padding:16px;margin-bottom:12px;border-radius:12px;border:1px solid #1f2933;background:#111827;color:#fff;outline:none; font-size: 15px;}
  .authBox button{width:100%;padding:15px;border-radius:30px;background:#1d9bf0;color:#fff;border:none;font-weight:700;cursor:pointer; font-size: 16px;}
  
  .avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}
  .avatar-grid img{width:65px;height:65px;border-radius:50%;border:3px solid transparent;cursor:pointer;object-fit:cover;}
  .avatar-grid input:checked + img{border-color:#1d9bf0;transform:scale(1.1)}

  /* CHAT PAGE */
  #chatScreen{display:none;flex-direction:column;height:100vh;background:#ece5dd}
  .header{background:#075e54;padding:12px 16px;display:flex;align-items:center;gap:15px;cursor:pointer; z-index: 10;}
  .header img{width:50px;height:50px;border-radius:50%;object-fit:cover}
  .header b{font-size:22px;font-weight:bold}

  .messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');}
  .msg{display:flex;gap:10px;max-width:85%; animation: fadeIn 0.3s;}
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg img{width:35px;height:35px;border-radius:50%;object-fit:cover; border: 1px solid #ccc;}
  .msg div{background:#fff;padding:8px 12px;border-radius:12px;color:#000;box-shadow:0 1px 2px rgba(0,0,0,0.1); position: relative;}
  .msg.me div{background:#dcf8c6}
  .msg b{font-size:11px;color:#075e54;display:block; margin-bottom: 2px;}

  .reply-box{background:rgba(0,0,0,0.08);border-left:4px solid #075e54;padding:5px;border-radius:5px;margin-bottom:5px;font-size:12px; color: #555;}
  #replyPreview{display:none;background:#fff;color:#000;padding:10px;border-top:1px solid #ddd; position: relative;}
  #replyPreview span{float: right; color: red; font-weight: bold; cursor: pointer;}

  .inputArea{background:#f0f0f0;padding:10px}
  .inputBar{display:flex;gap:10px;align-items:center}
  .inputBar input{flex:1;padding:12px 18px;border-radius:25px;border:none;outline:none; font-size: 15px;}
  .send-btn{background:#075e54;border:none;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}

  /* MODALS */
  #userModal, #editAvatarModal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:380px;background:#fff;color:#000;z-index:1000;border-radius:20px;padding:20px;box-shadow:0 5px 50px rgba(0,0,0,0.5)}
  .user-item{display:flex;align-items:center;gap:15px;padding:12px 0;border-bottom:1px solid #eee}
  .user-item img{width:45px;height:45px;border-radius:50%;object-fit:cover}
  .avatar-edit-grid{display:grid; grid-template-columns: repeat(4,1fr); gap: 10px;}
  .avatar-edit-grid img{width: 100%; border-radius: 50%; cursor: pointer; border: 2px solid transparent;}
  .avatar-edit-grid img:hover{border-color: #1d9bf0;}
</style>
</head>
<body>

<div id="authScreen">
  <div class="authBox">
    <img class="logo-big" src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499341.jpg?alt=media&token=831a06cf-e900-464e-a6c5-9e59c1306f38">

    <div id="loginForm">
      <input id="liEmail" type="email" placeholder="Email Address">

        <label><input type="radio" name="avatar" value="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499398.jpg?alt=media&token=645d0462-7aac-4cf4-82f8-aae1c3ae7779" hidden><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499398.jpg?alt=media&token=645d0462-7aac-4cf4-82f8-aae1c3ae7779"></label>
        <label><input type="radio" name="avatar" value="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499399.jpg?alt=media&token=d9a95282-bbe6-4414-b7fc-5816d5d82d9a" hidden><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499399.jpg?alt=media&token=d9a95282-bbe6-4414-b7fc-5816d5d82d9a"></label>
        <label><input type="radio" name="avatar" value="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499400.jpg?alt=media&token=999e7e0f-59ee-477a-9813-05bfbfa7fa68" hidden><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499400.jpg?alt=media&token=999e7e0f-59ee-477a-9813-05bfbfa7fa68"></label>
        <label><input type="radio" name="avatar" value="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499409.jpg?alt=media&token=9596eeee-4088-4278-89ad-987d86146673" hidden><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499409.jpg?alt=media&token=9596eeee-4088-4278-89ad-987d86146673"></label>
        <label><input type="radio" name="avatar" value="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499405.jpg?alt=media&token=28caa677-96e8-4310-a0db-71792fc431f9" hidden><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499405.jpg?alt=media&token=28caa677-96e8-4310-a0db-71792fc431f9"></label>
        <label><input type="radio" name="avatar" value="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499411.jpg?alt=media&token=8e9cf974-e835-43c3-9771-fe684395d320" hidden><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499411.jpg?alt=media&token=8e9cf974-e835-43c3-9771-fe684395d320"></label>
        <label><input type="radio" name="avatar" value="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499410.jpg?alt=media&token=c73a6d06-88c6-44b2-966c-dc5597f41680" hidden><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499410.jpg?alt=media&token=c73a6d06-88c6-44b2-966c-dc5597f41680"></label>
      </div>
      <button onclick="signup()">Signup</button>
      <p style="margin-top:20px;font-size:14px;cursor:pointer" onclick="signupForm.style.display='none';loginForm.style.display='block'">Already have an account? Log In</p>
    </div>
  </div>
</div>

<div id="chatScreen">
  <div class="header" onclick="toggleUserList()">
    <img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499341.jpg?alt=media&token=831a06cf-e900-464e-a6c5-9e59c1306f38">
    <div style="flex:1">
      <b>3 Idiots</b><br>
      <small id="userCount" style="color:#dcf8c6">0 Members</small>
    </div>
    <button style="background:none;border:none;color:#fff;font-weight:bold;cursor:pointer" onclick="event.stopPropagation();logout()">Logout</button>
  </div>

  <div id="userModal">
    <h3 style="margin:0 0 15px 0; text-align: center;">Group Members</h3>
    <div id="userList" style="max-height:300px;overflow-y:auto"></div>
    <button onclick="toggleUserList()" style="width:100%;margin-top:15px;padding:12px;border:none;background:#075e54;color:#fff;border-radius:10px;font-weight:bold">Close</button>
  </div>

  <div id="editAvatarModal">
    <h3 style="margin:0 0 15px 0; text-align: center;">Change Avatar</h3>
    <div class="avatar-edit-grid">
        <img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499397.jpg?alt=media&token=7f02001d-4800-4fa2-b927-8ab67d10f6f5" onclick="changeAvatar(this.src)">
        <img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499398.jpg?alt=media&token=645d0462-7aac-4cf4-82f8-aae1c3ae7779" onclick="changeAvatar(this.src)">
        <img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499399.jpg?alt=media&token=d9a95282-bbe6-4414-b7fc-5816d5d82d9a" onclick="changeAvatar(this.src)">
        <img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499400.jpg?alt=media&token=999e7e0f-59ee-477a-9813-05bfbfa7fa68" onclick="changeAvatar(this.src)">
        <img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499409.jpg?alt=media&token=9596eeee-4088-4278-89ad-987d86146673" onclick="changeAvatar(this.src)">
        <img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499405.jpg?alt=media&token=28caa677-96e8-4310-a0db-71792fc431f9" onclick="changeAvatar(this.src)">
        <img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499411.jpg?alt=media&token=8e9cf974-e835-43c3-9771-fe684395d320" onclick="changeAvatar(this.src)">
        <img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499410.jpg?alt=media&token=c73a6d06-88c6-44b2-966c-dc5597f41680" onclick="changeAvatar(this.src)">
    </div>
    <button onclick="editAvatarModal.style.display='none'" style="width:100%;margin-top:15px;padding:10px;border:none;background:#ccc;border-radius:10px;font-weight:bold">Cancel</button>
  </div>

  <div class="messages" id="messages"></div>

  <div class="inputArea">
    <div id="replyPreview"></div>
    <div class="inputBar">
      <input id="msg" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" width="24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

</body>
