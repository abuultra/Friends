<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3 Idiots • MADARA ALPHA</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
  import { getDatabase, ref, push, onValue, serverTimestamp, set, update, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBTTVVmV2J4A8QqG9gaTFjhTzDW6RqgNps",
    authDomain: "madara-62f7b.firebaseapp.com",
    databaseURL: "https://madara-62f7b-default-rtdb.firebaseio.com",
    projectId: "madara-62f7b",
    storageBucket: "madara-62f7b.firebasestorage.app",
    messagingSenderId: "282972851212",
    appId: "1:282972851212:web:64980ccdfa06b317357229"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const rtdb = getDatabase(app);

  let replyTo = null;
  let allUsers = {};
  let selectedMsgId = null;
  let isEditing = false;
  let pressTimer;

  onAuthStateChanged(auth, user => {
    if (user) {
      authScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      const userRef = ref(rtdb, 'users/' + user.uid);
      // Use update instead of set to prevent overwriting existing data
      update(userRef, { name: user.displayName, photo: user.photoURL, status: "Online" });
      onDisconnect(userRef).update({ status: "Offline" });
      loadSettings();
      loadUsers();
    } else {
      authScreen.style.display = 'flex';
      chatScreen.style.display = 'none';
    }
  });

  function loadSettings() {
    onValue(ref(rtdb, 'settings'), snap => {
      const s = snap.val();
      if(s) {
        groupNameDisplay.innerText = s.groupName || "3 Idiots";
        messages.style.backgroundImage = s.themeUrl ? `url('${s.themeUrl}')` : "none";
        messages.style.backgroundColor = s.bgColor || "#ece5dd";
      }
    });
  }

  window.updateGroupName = () => {
    const newName = prompt("Enter New Group Name:");
    if(newName) update(ref(rtdb, 'settings'), { groupName: newName });
  };

  window.setTheme = (url, color) => {
    update(ref(rtdb, 'settings'), { themeUrl: url, bgColor: color });
  };

  window.signup = async () => {
    const name = suName.value.trim();
    const avatar = document.querySelector('input[name="avatar"]:checked').value;
    try {
      const cred = await createUserWithEmailAndPassword(auth, suEmail.value, suPass.value);
      await updateProfile(cred.user, { displayName: name, photoURL: avatar });
      // Save user to DB immediately on signup
      await set(ref(rtdb, 'users/' + cred.user.uid), { name, photo: avatar, status: "Online" });
      location.reload();
    } catch (e) { alert(e.message); }
  };

  window.sendMessage = () => {
    const text = msg.value.trim();
    if (!text) return;
    if (isEditing) {
      update(ref(rtdb, 'messages/' + selectedMsgId), { text: text, edited: true });
      isEditing = false;
    } else {
      push(ref(rtdb, 'messages'), {
        text, uid: auth.currentUser.uid, time: serverTimestamp(), reply: replyTo
      });
    }
    cancelReply();
    msg.value = '';
  };

  window.changeAvatar = async (newUrl) => {
    try {
        await updateProfile(auth.currentUser, { photoURL: newUrl });
        await update(ref(rtdb, 'users/' + auth.currentUser.uid), { photo: newUrl });
        editAvatarModal.style.display = 'none';
        alert("Avatar Updated! ✨");
    } catch (e) { alert(e.message); }
  };

  function loadUsers() {
    onValue(ref(rtdb, 'users'), snap => {
      userList.innerHTML = '';
      allUsers = snap.val() || {};
      let count = 0;
      snap.forEach(child => {
        const u = child.val();
        if(u.name) {
          count++;
          const isMe = child.key === auth.currentUser.uid;
          userList.innerHTML += `
            <div class="user-item">
              <img src="${u.photo}">
              <span style="flex:1"><b>${u.name}</b> <br> <small style="color:${u.status=='Online'?'#25d366':'#999'}">${u.status}</small></span>
              ${isMe ? `<button onclick="editAvatarModal.style.display='block'" style="background:#075e54; color:white; border:none; padding:5px 10px; border-radius:5px;">Edit</button>` : ''}
            </div>`;
        }
      });
      userCount.innerText = count + " Members";
      loadMessages();
    });
  }

  function loadMessages() {
    onValue(ref(rtdb, 'messages'), snap => {
      messages.innerHTML = '';
      snap.forEach(child => {
        const m = child.val();
        const userData = allUsers[m.uid] || { name: "User", photo: "https://via.placeholder.com/30" };
        const isMe = m.uid === auth.currentUser.uid;
        const div = document.createElement('div');
        div.className = isMe ? 'msg me' : 'msg';
        
        div.ontouchstart = (e) => {
          div.dataset.startX = e.touches[0].clientX;
          selectedMsgId = child.key;
          pressTimer = setTimeout(() => {
            if(isMe) {
               msgActionMenu.style.display = 'flex';
               selectedMsgText = m.text;
            }
          }, 600);
        };

        div.ontouchmove = (e) => {
          let diff = e.touches[0].clientX - div.dataset.startX;
          if (diff > 60) {
            setReply(userData.name, m.text);
            clearTimeout(pressTimer);
          }
        };

        div.ontouchend = () => clearTimeout(pressTimer);
        
        div.innerHTML = `
          <img src="${userData.photo}">
          <div class="msg-bubble">
            ${m.reply ? `<div class="reply-box"><b>${m.reply.name}</b><p>${m.reply.text}</p></div>` : ''}
            <b>${userData.name} ${m.edited ? '<small>(edited)</small>' : ''}</b>
            <p>${m.text}</p>
          </div>`;
        messages.appendChild(div);
      });
      messages.scrollTop = messages.scrollHeight;
    });
  }

  let selectedMsgText = "";
  window.deleteMessage = () => {
    if(confirm("Delete this message?")) remove(ref(rtdb, 'messages/' + selectedMsgId));
    msgActionMenu.style.display = 'none';
  };

  window.editMessage = () => {
    msg.value = selectedMsgText;
    isEditing = true;
    msg.focus();
    msgActionMenu.style.display = 'none';
  };

  window.setReply = (name, text) => {
    replyTo = { name, text };
    replyPreview.style.display = 'block';
    replyPreview.innerHTML = `Replying to <b>${name}</b>: ${text} <span onclick="cancelReply()" style="float:right; color:red; cursor:pointer">×</span>`;
  };
  window.cancelReply = () => { replyTo = null; replyPreview.style.display = 'none'; isEditing = false; };
  window.toggleUserList = () => { userModal.style.display = userModal.style.display === 'block' ? 'none' : 'block'; };
  window.login = () => signInWithEmailAndPassword(auth, liEmail.value, liPass.value);
  window.logout = () => signOut(auth);
</script>

<style>
  *{box-sizing:border-box; transition: 0.3s; -webkit-tap-highlight-color: transparent;}
  body{margin:0;font-family:system-ui;background:#0b141a;color:#fff; overflow:hidden;}
  
  #authScreen{min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:20px;}
  .authBox{width:100%;max-width:400px;text-align:center;}
  .logo-big{width:120px;height:120px;border-radius:50%;margin-bottom:20px;border:3px solid #075e54;object-fit:cover;}
  .authBox input{width:100%;padding:15px;margin-bottom:10px;border-radius:10px;border:none;background:#111827;color:#fff;}
  .authBox button{width:100%;padding:15px;border-radius:25px;background:#1d9bf0;color:#fff;border:none;font-weight:700;}
  
  .avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0;}
  .avatar-grid img{width:100%; aspect-ratio:1/1; border-radius:50%;border:3px solid transparent;object-fit:cover;}
  .avatar-grid input:checked + img{border-color:#1d9bf0;transform:scale(1.1);}

  #chatScreen{display:none;flex-direction:column;height:100dvh; width:100%;}
  .header{background:#075e54;padding:12px 16px;display:flex;align-items:center;gap:15px;z-index:100;}
  .header img{width:45px;height:45px;border-radius:50%;object-fit:cover;}
  
  .messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px; background-size: cover; background-position: center;}
  .msg{display:flex;gap:10px;max-width:85%; position:relative;}
  .msg.me{align-self:flex-end;flex-direction:row-reverse;}
  .msg img{width:35px;height:35px;border-radius:50%;object-fit:cover;}
  .msg-bubble{background:#fff;padding:8px 12px;border-radius:12px;color:#000;box-shadow:0 1px 2px rgba(0,0,0,0.1);}
  .msg.me .msg-bubble{background:#dcf8c6;}
  .msg b{font-size:11px;color:#075e54;display:block;}

  .reply-box{background:rgba(0,0,0,0.08);border-left:4px solid #075e54;padding:5px;border-radius:5px;margin-bottom:5px;font-size:12px;}
  #replyPreview{display:none;background:#fff;color:#000;padding:10px;border-top:1px solid #ddd; font-size: 13px;}

  .inputArea{background:#f0f0f0;padding:10px; padding-bottom: max(10px, env(safe-area-inset-bottom));}
  .inputBar{display:flex;gap:10px;align-items:center;}
  .inputBar input{flex:1;padding:12px 18px;border-radius:25px;border:none;outline:none; color:#000; font-size:16px;}
  .send-btn{background:#075e54;border:none;width:45px;height:45px;border-radius:50%;color:#fff; cursor: pointer;}

  #userModal, #editAvatarModal, #msgActionMenu{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:380px;background:#fff;color:#000;z-index:1000;border-radius:20px;padding:20px;box-shadow:0 0 50px rgba(0,0,0,0.5);}
  #msgActionMenu{flex-direction: column; gap: 10px;}
  .action-btn{width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;}
  
  .user-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee;}
  .user-item img{width:40px;height:40px;border-radius:50%;object-fit:cover;}
</style>
</head>
<body>

<div id="authScreen">
  <div class="authBox">
    <img class="logo-big" src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499341.jpg?alt=media&token=831a06cf-e900-464e-a6c5-9e59c1306f38">
    <h2>3 Idiots</h2>
    <div id="loginForm">
      <input id="liEmail" placeholder="Email"><input id="liPass" type="password" placeholder="Password">
      <button onclick="login()">Log In</button>
      <p style="cursor:pointer" onclick="signupForm.style.display='block';loginForm.style.display='none'">Create Account</p>
    </div>
    <div id="signupForm" style="display:none">
      <input id="suName" placeholder="Name"><input id="suEmail" placeholder="Email"><input id="suPass" type="password" placeholder="Password">
      <div class="avatar-grid">
        <label><input type="radio" name="avatar" value="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499397.jpg?alt=media&token=7f02001d-4800-4fa2-b927-8ab67d10f6f5" checked hidden><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499397.jpg?alt=media&token=7f02001d-4800-4fa2-b927-8ab67d10f6f5"></label>
        <label><input type="radio" name="avatar" value="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499398.jpg?alt=media&token=645d0462-7aac-4cf4-82f8-aae1c3ae7779" hidden><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499398.jpg?alt=media&token=645d0462-7aac-4cf4-82f8-aae1c3ae7779"></label>
        <label><input type="radio" name="avatar" value="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499399.jpg?alt=media&token=d9a95282-bbe6-4414-b7fc-5816d5d82d9a" hidden><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499399.jpg?alt=media&token=d9a95282-bbe6-4414-b7fc-5816d5d82d9a"></label>
        <label><input type="radio" name="avatar" value="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499400.jpg?alt=media&token=999e7e0f-59ee-477a-9813-05bfbfa7fa68" hidden><img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499400.jpg?alt=media&token=999e7e0f-59ee-477a-9813-05bfbfa7fa68"></label>
      </div>
      <button onclick="signup()">Signup</button>
    </div>
  </div>
</div>

<div id="chatScreen">
  <div class="header" onclick="toggleUserList()">
    <img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499341.jpg?alt=media&token=831a06cf-e900-464e-a6c5-9e59c1306f38">
    <div style="flex:1">
      <b id="groupNameDisplay">3 Idiots</b><br>
      <small id="userCount">0 Members</small>
    </div>
    <button onclick="event.stopPropagation();logout()" style="background:none; border:none; color:#fff;">Logout</button>
  </div>

  <div id="msgActionMenu">
    <h4 style="margin:0; text-align:center">Message Options</h4>
    <button class="action-btn" style="background:#e3f2fd" onclick="editMessage()">Edit Message</button>
    <button class="action-btn" style="background:#ffebee; color:red" onclick="deleteMessage()">Delete for Everyone</button>
    <button class="action-btn" style="background:#eee" onclick="msgActionMenu.style.display='none'">Cancel</button>
  </div>

  <div id="userModal">
    <h3>Group Settings</h3>
    <button onclick="updateGroupName()" style="width:100%; padding:10px; margin-bottom:10px; background:#1d9bf0; color:#fff; border:none; border-radius:5px;">Edit Group Name</button>
    <div style="margin-bottom:15px; display:flex; gap:5px; flex-wrap:wrap;">
      <button class="theme-btn" style="background:#ff4757; border:none; padding:5px; color:white;" onclick="setTheme('','pink')">Love</button>
      <button class="theme-btn" style="background:#2ed573; border:none; padding:5px; color:white;" onclick="setTheme('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png','#ece5dd')">Classic</button>
    </div>
    <div id="userList" style="max-height:200px; overflow-y:auto"></div>
    <button onclick="toggleUserList()" style="width:100%; margin-top:15px; padding:10px; background:#075e54; color:#fff; border:none; border-radius:5px;">Close</button>
  </div>

  <div id="editAvatarModal">
    <h3>Choose New Avatar</h3>
    <div class="avatar-grid" style="grid-template-columns:repeat(3,1fr)">
        <img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499397.jpg?alt=media&token=7f02001d-4800-4fa2-b927-8ab67d10f6f5" onclick="changeAvatar(this.src)">
        <img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499398.jpg?alt=media&token=645d0462-7aac-4cf4-82f8-aae1c3ae7779" onclick="changeAvatar(this.src)">
        <img src="https://firebasestorage.googleapis.com/v0/b/i-to-u.appspot.com/o/publicimage%2F1000499399.jpg?alt=media&token=d9a95282-bbe6-4414-b7fc-5816d5d82d9a" onclick="changeAvatar(this.src)">
    </div>
    <button onclick="editAvatarModal.style.display='none'" style="width:100%; background:#ccc; padding:10px; border:none; border-radius:5px; margin-top:10px;">Cancel</button>
  </div>

  <div class="messages" id="messages"></div>
  <div class="inputArea">
    <div id="replyPreview"></div>
    <div class="inputBar">
      <input id="msg" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMessage()" autocomplete="off">
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>
</body>
</html>
